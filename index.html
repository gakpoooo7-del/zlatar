  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0F1B2B',
            textPrimary: '#111827',
            textSecondary: '#1F2937',
            accentBronze: '#8C5A2B',
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-12px) rotate(1deg)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
              '50%': { opacity: '0.7', transform: 'scale(1.1)' },
            },
            shine: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(200%)' },
            }
          },
          animation: {
            floatSlow: 'floatSlow 7s ease-in-out infinite',
            pulseGlow: 'pulseGlow 5s ease-in-out infinite',
            shine: 'shine 2.5s infinite',

        }

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      background-color: #0F1B2B;
      margin: 0;
      padding: 0;
    }
    
    .contrast-glow {
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6), 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .dark-glow {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* Napredne Reveal Animacije */
    .reveal-item {
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .reveal-item.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Stagger efekat za listu */
    .stagger-child {
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-item.active .stagger-child:nth-child(1) { transition-delay: 0.2s; opacity: 1; transform: translateX(0); }
    .reveal-item.active .stagger-child:nth-child(2) { transition-delay: 0.35s; opacity: 1; transform: translateX(0); }
    .reveal-item.active .stagger-child:nth-child(3) { transition-delay: 0.5s; opacity: 1; transform: translateX(0); }

    /* 3D Container Transform */
    .tilt-card {

      perspective: 1000px;

    .sheen-overlay {

    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {

    }
  </style>

    // Canvas sa lebdećim česticama
    function BackgroundParticles() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resizeCanvas = () => {
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = canvas.parentElement.clientHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = Array.from({ length: 45 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 0.5,
          alpha: Math.random() * 0.5 + 0.2,
          speedY: - (Math.random() * 0.4 + 0.1),
          speedX: (Math.random() - 0.5) * 0.2
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          particles.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y < 0) {
              p.y = canvas.height;
              p.x = Math.random() * canvas.width;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(251, 191, 36, ${p.alpha})`;
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-0 opacity-60" />;
    }

    // Interactive 3D Card Component
    function InteractiveCard({ sec, isEven, onOpenDetails }) {
      const cardRef = useRef(null);
      const [transform, setTransform] = useState('perspective(1000px) rotateX(0deg) rotateY(0deg)');
      const [glowPos, setGlowPos] = useState({ x: 50, y: 50 });

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;

        setTransform(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`);
        setGlowPos({ x: (x / rect.width) * 100, y: (y / rect.height) * 100 });
      };

      const handleMouseLeave = () => {
        setTransform('perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)');
      };

      return (
        <section
          id={sec.id}
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{ transform, transition: 'transform 0.15s ease-out' }}
          className={`reveal-item tilt-card rounded-3xl border ${sec.accent} backdrop-blur-2xl p-8 sm:p-12 md:p-16 transition-all duration-500 hover:border-amber-400/50 shadow-[0_15px_40px_rgba(0,0,0,0.6)] relative overflow-hidden group`}
        >
          {/* Dynamic Radial Glow */}
          <div
            className="absolute inset-0 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0"
            style={{
              background: `radial-gradient(600px circle at ${glowPos.x}% ${glowPos.y}%, ${sec.glowColor}, transparent 40%)`

          ></div>

          <div className="absolute inset-0 sheen-overlay opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none z-0"></div>

          <div className={`relative z-10 flex flex-col lg:flex-row items-start gap-12 ${isEven ? '' : 'lg:flex-row-reverse'}`}>

              <div className="flex items-center gap-3 mb-6">
                <span className={`px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest border backdrop-blur-md shadow-lg ${sec.badgeBg}`}>
                  {sec.badge}
                </span>
              </div>

                {sec.title}
              </h3>

              <p className="text-gray-300 text-base sm:text-lg leading-relaxed font-light mb-8">
                {sec.description}
              </p>

              {/* Lista sa Stagger Animacijom */}
              <div className="space-y-4 mb-8">
                {sec.features.map((feat, fIdx) => (
                  <div key={fIdx} className="stagger-child flex items-start gap-3">
                    <div className="w-6 h-6 rounded-full bg-amber-400/10 border border-amber-400/40 flex items-center justify-center text-amber-300 shrink-0 mt-0.5 group-hover:border-amber-400 group-hover:scale-110 transition-all duration-300">
                      <i data-lucide="check" className="w-3.5 h-3.5"></i>
                    </div>
                    <span className="text-sm sm:text-base text-gray-200 font-medium">
                      {feat}
                    </span>
                  </div>
                ))}
              </div>

              {/* DUGME ZA OTVARANJE DETALJA */}
              <button
                onClick={() => onOpenDetails(sec)}
                className="inline-flex items-center gap-3 text-xs uppercase tracking-[0.25em] font-bold text-amber-300 hover:text-white transition-colors group/btn cursor-pointer focus:outline-none"
              >
                <span>Saznaj više o ovoj ponudi</span>
                <i data-lucide="arrow-right" className="w-4 h-4 group-hover/btn:translate-x-2 transition-transform duration-300"></i>
              </button>
            </div>

            {/* Vizuelni Blok Sa Ikonom */}
            <div className="w-full lg:w-80 h-64 lg:h-auto rounded-2xl bg-white/5 border border-white/10 flex flex-col items-center justify-center p-8 text-center relative group-hover:border-amber-400/30 transition-all duration-500 shrink-0 shadow-inner">
              <div className="w-20 h-20 rounded-full bg-gradient-to-br from-amber-400/20 to-amber-600/10 border border-amber-400/30 flex items-center justify-center text-amber-300 mb-6 group-hover:scale-110 group-hover:bg-amber-400 group-hover:text-brandDark transition-all duration-500 shadow-[0_0_25px_rgba(251,191,36,0.2)]">
                <i data-lucide={sec.icon} className="w-10 h-10"></i>
              </div>
              <span className="text-xs uppercase tracking-widest text-amber-200/80 font-bold">
                {sec.title}
              </span>
            </div>

          </div>
        </section>
      );
    }

    function useVideoScrub(videoSrc) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const [scrollProgress, setScrollProgress] = useState(0);
      const [canvasLive, setCanvasLive] = useState(false);
      const [duration, setDuration] = useState(0);

      const stateRef = useRef({
        targetTime: 0,
        currentTime: 0,
        bank: [],
        ready: false,
        reverted: false,
      });

      useEffect(() => {
        const updateCanvasSize = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
        };

        updateCanvasSize();
        window.addEventListener('resize', updateCanvasSize);
        return () => window.removeEventListener('resize', updateCanvasSize);
      }, []);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleLoadedMetadata = () => setDuration(video.duration || 0);
        video.addEventListener('loadedmetadata', handleLoadedMetadata);
        if (video.duration) setDuration(video.duration);

        let active = true;

        const cleanupBank = () => {
          stateRef.current.bank.forEach(item => {
            if (item.bmp && typeof item.bmp.close === 'function') item.bmp.close();
          });
          stateRef.current.bank = [];
        };

        const initFrameBank = async () => {
          if (!window.VideoDecoder || !window.MP4Box || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            stateRef.current.reverted = true;
            return;
          }

          try {
            const response = await fetch(videoSrc);
            if (!response.ok) throw new Error('Network error');
            const arrayBuffer = await response.arrayBuffer();
            arrayBuffer.fileStart = 0;

            const mp4file = MP4Box.createFile();
            let decoder = null;

            mp4file.onReady = (info) => {
              if (!active) return;
              const videoTrack = info.videoTracks[0];
              if (!videoTrack) return;

              decoder = new VideoDecoder({
                output: async (frame) => {
                  if (!active) { frame.close(); return; }
                  const ts = frame.timestamp;
                  try {
                    const bmp = await createImageBitmap(frame);
                    if (active) {
                      stateRef.current.bank.push({ ts, bmp });
                      stateRef.current.bank.sort((a, b) => a.ts - b.ts);
                      if (!stateRef.current.ready && stateRef.current.bank.length > 5) {
                        stateRef.current.ready = true;
                        setCanvasLive(true);
                      }
                    } else { bmp.close(); }
                  } catch (e) { console.warn(e); } finally { frame.close(); }
                },
                error: () => { stateRef.current.reverted = true; }
              });

              let description = null;
              try {
                const trak = mp4file.moov.traks.find(t => t.tkhd.track_id === videoTrack.id);
                const entry = trak.mdia.minf.stbl.stsd.entries[0];
                const box = entry.avcC || entry.hvcC || entry.vpcC || entry.av1C;
                if (box) {
                  const stream = new MP4Box.DataStream(undefined, 0, MP4Box.DataStream.BIG_ENDIAN);
                  box.write(stream);
                  description = new Uint8Array(stream.buffer, 8);
                }
              } catch (e) {}

              decoder.configure({
                codec: videoTrack.codec,
                codedWidth: videoTrack.track_width,
                codedHeight: videoTrack.track_height,
                description: description
              });

              mp4file.setExtractionOptions(videoTrack.id);
              mp4file.start();
            };

            mp4file.onSamples = (id, user, samples) => {
              if (!active || !decoder) return;
              for (const sample of samples) {
                const chunk = new EncodedVideoChunk({
                  type: sample.is_sync ? 'key' : 'delta',
                  timestamp: sample.cts,
                  duration: sample.duration,
                  data: sample.data
                });
                if (decoder.state === 'configured') decoder.decode(chunk);
              }
            };

            mp4file.appendBuffer(arrayBuffer);
            mp4file.flush();
          } catch (err) {
            stateRef.current.reverted = true;
          }
        };

        initFrameBank();

        return () => {
          active = false;
          video.removeEventListener('loadedmetadata', handleLoadedMetadata);
          cleanupBank();
        };
      }, [videoSrc]);

      useEffect(() => {
        let animationFrameId;
        let lastTime = performance.now();

        const drawCoverImage = (ctx, img, canvasWidth, canvasHeight) => {
          const imgRatio = img.width / img.height;
          const canvasRatio = canvasWidth / canvasHeight;
          let renderWidth, renderHeight, offsetX, offsetY;

          if (canvasRatio > imgRatio) {
            renderWidth = canvasWidth;
            renderHeight = canvasWidth / imgRatio;
            offsetX = 0;
            offsetY = (canvasHeight - renderHeight) / 2;
          } else {
            renderWidth = canvasHeight * imgRatio;
            renderHeight = canvasHeight;
            offsetX = (canvasWidth - renderWidth) / 2;
            offsetY = 0;
          }

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, offsetX, offsetY, renderWidth, renderHeight);
        };

        const loop = (now) => {
          const dt = Math.min(0.1, (now - lastTime) / 1000);
          lastTime = now;

          const container = containerRef.current;
          let progress = 0;

          if (container) {
            const rect = container.getBoundingClientRect();
            const totalScrollable = container.offsetHeight - window.innerHeight;
            if (totalScrollable > 0) {
              progress = Math.min(1, Math.max(0, -rect.top / totalScrollable));
            }
          }

          setScrollProgress(progress);

          const video = videoRef.current;
          const canvas = canvasRef.current;
          const dur = video ? video.duration || duration : duration;

          if (dur > 0) {
            stateRef.current.targetTime = progress * dur;
            const LERP_TAU = 8;
            const diff = stateRef.current.targetTime - stateRef.current.currentTime;
            stateRef.current.currentTime += diff * (1 - Math.exp(-dt * LERP_TAU));

            const curr = stateRef.current.currentTime;

            if (stateRef.current.ready && canvas && !stateRef.current.reverted && stateRef.current.bank.length > 0) {
              const targetTs = curr * 1e6;
              const bank = stateRef.current.bank;
              let low = 0, high = bank.length - 1, nearest = 0;
              while (low <= high) {
                let mid = (low + high) >> 1;
                if (bank[mid].ts < targetTs) { nearest = mid; low = mid + 1; } else { high = mid - 1; }
              }
              const frameObj = bank[nearest];
              if (frameObj && frameObj.bmp && canvas) {
                const ctx = canvas.getContext('2d');
                if (ctx) drawCoverImage(ctx, frameObj.bmp, canvas.width, canvas.height);
              }
            } else if (video) {
              if (!video.seeking && Math.abs(video.currentTime - curr) > 0.01) {
                video.currentTime = curr;
              }
            }
          }

          animationFrameId = requestAnimationFrame(loop);
        };

        animationFrameId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animationFrameId);
      }, [duration]);

      return { videoRef, canvasRef, containerRef, scrollProgress, canvasLive };
    }

    function App() {
      const { videoRef, canvasRef, containerRef, scrollProgress, canvasLive } = useVideoScrub(VIDEO_URL);
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeModalSection, setActiveModalSection] = useState(null);

      const p = scrollProgress;
      const s1Opacity = p < 0.20 ? 1 : Math.max(0, 1 - (p - 0.20) / 0.08);
      const s2Opacity = p < 0.32 ? 0 : p < 0.40 ? (p - 0.32) / 0.08 : p < 0.55 ? 1 : Math.max(0, 1 - (p - 0.55) / 0.08);
      const s3Opacity = p < 0.67 ? 0 : p < 0.75 ? (p - 0.67) / 0.08 : 1;

      useEffect(() => {
        document.body.style.overflow = (menuOpen || activeModalSection) ? 'hidden' : 'auto';
      }, [menuOpen, activeModalSection]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, { threshold: 0.12 });

        document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);

      return (
        <div className="w-full bg-[#0F1B2B]">
          
          {/* Hero Video Scrub Section */}
          <div ref={containerRef} className="relative h-[500vh] w-full">
            <div className="sticky top-0 w-full h-screen overflow-hidden">
              <video
                ref={videoRef}
                src={VIDEO_URL}
                muted
                playsInline
                preload="auto"
                className="absolute inset-0 w-full h-full object-cover z-0"
              />

              <canvas
                ref={canvasRef}
                className={`absolute inset-0 w-full h-full z-10 transition-opacity duration-300 pointer-events-none ${canvasLive ? 'opacity-100' : 'opacity-0'}`}
              />

              <div className="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between">
                
                <nav className="absolute top-0 left-0 right-0 z-50 pointer-events-auto px-6 sm:px-8 md:px-12 pt-8 sm:pt-10 pb-6 flex items-center justify-between text-brandDark bg-gradient-to-b from-white/60 via-white/20 to-transparent backdrop-blur-[2px]">
                  <div className="hidden lg:flex items-center gap-8 xl:gap-10">
                    <a href="#zlatar" className="text-xs tracking-[0.2em] uppercase font-bold relative text-brandDark hover:text-black transition-colors contrast-glow">
                      PLANINA ZLATAR
                      <span className="absolute -bottom-2 left-0 w-full h-[2px] bg-brandDark"></span>
                    </a>
                    <a href="#priroda" className="text-xs tracking-[0.2em] uppercase font-semibold text-brandDark/85 hover:text-black transition-colors contrast-glow">PRIRODA</a>
                    <a href="#jezera" className="text-xs tracking-[0.2em] uppercase font-semibold text-brandDark/85 hover:text-black transition-colors contrast-glow">JEZERA</a>
                    <a href="#aktivnosti" className="text-xs tracking-[0.2em] uppercase font-semibold text-brandDark/85 hover:text-black transition-colors contrast-glow">AKTIVNOSTI</a>
                    <a href="#vidikovci" className="text-xs tracking-[0.2em] uppercase font-semibold text-brandDark/85 hover:text-black transition-colors contrast-glow">VIDIKOVCI</a>
                    <a href="#smestaj" className="text-xs tracking-[0.2em] uppercase font-semibold text-brandDark/85 hover:text-black transition-colors contrast-glow">SMEŠTAJ</a>
                  </div>

                  <button
                    onClick={() => setMenuOpen(true)}
                    className="lg:hidden flex flex-col gap-[5px] p-2 focus:outline-none"
                    aria-label="Open Menu"
                  >
                    <span className="w-6 h-[2px] bg-brandDark"></span>
                    <span className="w-6 h-[2px] bg-brandDark"></span>
                    <span className="w-4 h-[2px] bg-brandDark"></span>
                  </button>

                  <div className="hidden sm:flex items-center gap-6">
                    <div className="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
                      <span className="text-xs tracking-[0.2em] uppercase font-bold text-brandDark contrast-glow">INFO</span>
                      <div className="w-5 h-5 rounded-full flex items-center justify-center bg-brandDark text-white">
                        <i data-lucide="info" className="w-2.5 h-2.5"></i>
                      </div>
                    </div>
                    <button
                      onClick={() => setMenuOpen(true)}
                      className="text-xs tracking-[0.2em] uppercase font-bold text-brandDark hover:text-black transition-colors focus:outline-none contrast-glow"
                    >
                      MENU
                    </button>
                  </div>
                </nav>

                {/* Mobile Navigation */}
                <div className={`fixed inset-0 z-[100] bg-brandDark pointer-events-auto flex flex-col justify-between transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] ${menuOpen ? 'opacity-100 visible' : 'opacity-0 invisible pointer-events-none'}`}>
                  <div className="flex justify-end px-6 sm:px-8 pt-8 sm:pt-12">
                    <button
                      onClick={() => setMenuOpen(false)}
                      className="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center text-white hover:border-white transition-colors"
                    >
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  </div>

                  <div className={`flex flex-col items-center justify-center gap-4 transition-transform duration-500 ${menuOpen ? 'translate-y-0' : '-translate-y-8'}`}>
                    {['PRIRODA', 'JEZERA', 'AKTIVNOSTI', 'VIDIKOVCI', 'TRADICIONALNO', 'SMEŠTAJ'].map((link) => (
                      <a

                        href={`#${link.toLowerCase()}`}
                        onClick={() => setMenuOpen(false)}
                        className="font-serif text-2xl sm:text-3xl tracking-wide uppercase px-8 py-2 text-white/80 hover:text-amber-300 transition-colors"
                      >

                      </a>
                    ))}
                  </div>

                  <div className="flex flex-col sm:flex-row justify-between items-center gap-2 px-8 sm:px-12 pb-10 text-xs tracking-[0.2em] uppercase text-white/60">
                    <span>ZLATAR 2026</span>
                    <span className="text-amber-300/80 font-semibold tracking-[0.25em]">DESIGN BY TATOVICH</span>
                  </div>
                </div>

                <div
                  className="absolute inset-0 px-6 sm:px-8 md:px-20 lg:px-32 flex flex-col justify-center text-left transition-opacity duration-100 ease-out pointer-events-none"
                  style={{ opacity: s1Opacity }}
                >
                  <div className="max-w-3xl bg-white/30 backdrop-blur-md p-6 sm:p-10 rounded-2xl border border-white/40 shadow-2xl">
                    <h1 className="font-serif italic text-[clamp(2.5rem,6vw,5.5rem)] font-semibold leading-[1.05] text-[#0F1B2B] tracking-tight">
                      Planina Zlatar
                    </h1>
                    <p className="mt-3 text-xs sm:text-sm tracking-[0.3em] uppercase text-[#1F2937] font-bold">
                      Mesto gde priroda priča
                    </p>
                  </div>
                </div>

                <div
                  className="absolute inset-0 px-6 sm:px-8 flex items-center justify-center text-center transition-opacity duration-100 ease-out pointer-events-none"
                  style={{ opacity: s2Opacity }}
                >
                  <div className="max-w-[900px] bg-white/35 backdrop-blur-md p-8 sm:p-12 rounded-3xl border border-white/50 shadow-2xl">
                    <h2 className="font-serif text-[clamp(1.8rem,4.5vw,4.5rem)] font-medium tracking-wide leading-[1.2] text-[#0F1B2B]">
                      Upoznajte netaknutu lepotu{" "}
                      <span className="italic text-[#2D4356]">i spokoj</span>{" "}
                      <span className="text-[#3A4F66]">zlatarskog kraja</span>
                    </h2>
                  </div>
                </div>

                <div
                  className="absolute inset-0 px-6 sm:px-8 md:px-20 lg:px-32 flex items-center justify-end text-left transition-opacity duration-100 ease-out pointer-events-none"
                  style={{ opacity: s3Opacity }}
                >
                  <div className="max-w-2xl bg-black/40 backdrop-blur-md p-8 sm:p-12 rounded-3xl border border-white/20 shadow-2xl">
                    <p className="text-amber-200/90 text-xs sm:text-sm tracking-[0.3em] uppercase mb-3 font-semibold dark-glow">
                      Zlatar | Uvac
                    </p>
                    <h2 className="font-serif italic text-[clamp(2.2rem,4.5vw,4.5rem)] font-normal text-white leading-[1.15] tracking-wide mb-8 dark-glow">
                      Otkrijte sve lepote<br />zlatarske regije.
                    </h2>

                    <a href="#priroda" className="inline-flex items-center gap-4 pointer-events-auto cursor-pointer group">
                      <span className="text-xs tracking-[0.3em] text-white uppercase group-hover:text-amber-200 transition-colors dark-glow font-semibold">
                        Kreni u obilazak
                      </span>
                      <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center text-brandDark group-hover:scale-110 transition-transform duration-300 shadow-lg">
                        <i data-lucide="arrow-down" className="w-4 h-4"></i>
                      </div>
                    </a>
                  </div>
                </div>

              </div>
            </div>
          </div>

          {/* TEMATSKI BLOKOVI */}
          <div 
            className="relative z-30 text-white bg-cover bg-center bg-fixed border-t border-white/10 overflow-hidden"
            style={{ backgroundImage: "url('./beloglavi.jpg')" }}
          >
            <div className="absolute inset-0 bg-gradient-to-b from-[#0F1B2B]/95 via-[#0F1B2B]/90 to-[#0F1B2B]/95 z-0"></div>

            <BackgroundParticles />

            <div className="relative z-10 max-w-7xl mx-auto px-6 sm:px-12 py-24">
              
              <div className="text-center max-w-3xl mx-auto mb-28 reveal-item">
                <span className="text-amber-400 text-xs tracking-[0.35em] uppercase font-bold block mb-4 animate-pulseGlow">
                  ISTRAŽITE REGION
                </span>
                <h2 className="font-serif italic text-4xl sm:text-6xl md:text-7xl text-white font-normal dark-glow">
                  Priroda, Avantura & Tradicija
                </h2>
                <div className="w-20 h-[2px] bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto mt-6"></div>
              </div>

              <div className="space-y-28">
                {CATEGORY_SECTIONS.map((sec, idx) => (
                  <InteractiveCard 
                    key={sec.id} 
                    sec={sec} 
                    isEven={idx % 2 === 0} 
                    onOpenDetails={(sectionData) => setActiveModalSection(sectionData)}
                  />
                ))}
              </div>

              <div className="mt-36 reveal-item text-center">
                <div className="relative p-12 sm:p-20 rounded-3xl bg-gradient-to-r from-amber-500/10 via-amber-400/20 to-amber-500/10 border border-amber-400/30 backdrop-blur-2xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] overflow-hidden group">
                  <div className="absolute top-0 right-0 w-96 h-96 bg-amber-400/10 rounded-full blur-3xl animate-pulseGlow"></div>
                  
                  <h3 className="font-serif italic text-3xl sm:text-5xl text-white mb-6 relative z-10">
                    Planirate posetu Zlataru?
                  </h3>
                  <p className="text-gray-300 max-w-xl mx-auto mb-10 text-sm sm:text-base font-light relative z-10">
                    Organizujte vaš idealan vikend ili odmor uz našu pomoć. Informacije o smeštaju, vodičima i izletima na jednom mestu.
                  </p>
                  <a
                    href="#kontakt"
                    className="relative z-10 inline-block px-10 py-5 bg-amber-400 text-brandDark rounded-full font-bold text-xs uppercase tracking-[0.2em] hover:bg-amber-300 transition-all shadow-[0_0_30px_rgba(251,191,36,0.4)] hover:shadow-[0_0_50px_rgba(251,191,36,0.7)] hover:scale-105 active:scale-95"
                  >
                    Kontaktirajte Nas
                  </a>
                </div>
              </div>

            </div>
          </div>

          {/* DETALJAN MODAL POP-UP */}
          {activeModalSection && (
            <DetailModal 
              section={activeModalSection} 
              onClose={() => setActiveModalSection(null)} 
            />
          )}

          {/* FOOTER */}
          <footer className="relative z-30 bg-black/95 border-t border-white/10 py-12 px-6">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-gray-400 tracking-wider">
              <p>© 2026 Planina Zlatar. Sva prava zadržana.</p>
              
              <div className="flex items-center gap-3 bg-white/5 border border-white/10 px-5 py-2.5 rounded-full hover:border-amber-400/40 transition-colors group">
                <span className="text-gray-400 text-[11px] uppercase tracking-[0.2em]">Dizajn i razvoj:</span>
                <span className="text-amber-300 font-bold uppercase tracking-[0.25em] text-[11px] group-hover:text-amber-200 transition-colors">
                  Design by Tatovich
                </span>
                <span className="text-gray-500 text-[10px] font-light">| Stefan Tatković</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
